name: Draft editorials

# Scheduled editorial-drafting agent — companion to draft-entries.yml, see
# that file's header comment for why this runs on GitHub Actions instead
# of a Claude Code cloud routine.

on:
  # Schedule disabled 2026-09-29: ANTHROPIC_API_KEY/CRON_SECRET repo secrets
  # were never added (see PROJECT_LOG.md, Known Issue 2a), so this has
  # failed on every single scheduled run since 2026-09-16 — 2 weeks of
  # daily failure-email spam with zero successful drafts. Re-enable the
  # schedule block below once both secrets are added at Settings → Secrets
  # and variables → Actions, and a manual workflow_dispatch run succeeds.
  # schedule:
  #   # 3:45 UTC = ~9:15am IST
  #   - cron: "45 3 * * *"
  workflow_dispatch: {}

jobs:
  draft-editorials:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run drafting agent
        env:
          MODE: editorials
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: node scripts/pipeline/run-agent.mjs
